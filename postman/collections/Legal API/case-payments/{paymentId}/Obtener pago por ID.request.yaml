$kind: http-request
url: "{{baseUrl}}/case-payments/:paymentId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: paymentId
    value: string
    description: ID del pago
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
examples: ./.resources/Obtener pago por ID.resources/examples
order: 1000
