$kind: http-example
request:
  url: "{{baseUrl}}/case-payments/:paymentId"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: paymentId
      value: string
      description: ID del pago
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
