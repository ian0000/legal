$kind: http-example
request:
  url: "{{baseUrl}}/notes"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "caseId": "string",
        "content": "El cliente entregó documentación adicional.",
        "stageId": "string",
        "visibleToClient": false,
        "attachments": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
