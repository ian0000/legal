$kind: http-example
request:
  url: "{{baseUrl}}/notes/:noteId"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: noteId
      value: string
      description: ID de la nota
  body:
    type: json
    content: |-
      {
        "content": "string",
        "visibleToClient": true,
        "attachments": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 3000
