$kind: http-request
url: "{{baseUrl}}/clients/:id/stats"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: string
    description: ID del cliente
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
examples: ./.resources/Obtener estadísticas de un cliente.resources/examples
order: 1000
