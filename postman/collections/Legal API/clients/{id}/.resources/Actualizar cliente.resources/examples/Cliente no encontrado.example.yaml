$kind: http-example
request:
  url: "{{baseUrl}}/clients/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: ID del cliente
  body:
    type: json
    content: |-
      {
        "firstName": "string",
        "lastName": "string",
        "cedula": "string",
        "email": "VH4PVVish6Z@AfcJyRapIdYJiXLxdSftK.gkoc",
        "phone": "string",
        "address": "string",
        "notes": "string",
        "userId": "string",
        "isActive": false
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 3000
