$kind: http-example
request:
  url: "{{baseUrl}}/clients"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "firstName": "string",
        "lastName": "string",
        "cedula": "string",
        "email": "nXyKGWX-v@YipuashpIDuttW.jx",
        "phone": "string",
        "address": "string",
        "notes": "string",
        "userId": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
