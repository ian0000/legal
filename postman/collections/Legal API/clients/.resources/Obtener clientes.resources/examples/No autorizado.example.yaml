$kind: http-example
request:
  url: "{{baseUrl}}/clients?search=string&isActive=false&page=9002&limit=9002"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: search
      value: string
      description: Buscar clientes
    - key: isActive
      value: "false"
      description: Filtrar clientes activos
    - key: page
      value: "9002"
      description: Número de página
    - key: limit
      value: "9002"
      description: Cantidad de resultados
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
