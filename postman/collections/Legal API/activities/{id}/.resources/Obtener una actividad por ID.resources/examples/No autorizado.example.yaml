$kind: http-example
request:
  url: "{{baseUrl}}/activities/:id"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: ID de la actividad
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
