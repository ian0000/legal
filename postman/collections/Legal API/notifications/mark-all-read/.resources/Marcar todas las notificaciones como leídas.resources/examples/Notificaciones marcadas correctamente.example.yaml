$kind: http-example
request:
  url: "{{baseUrl}}/notifications/mark-all-read"
  method: PUT
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Todas las notificaciones fueron marcadas como leídas"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "message": {
            "type": "string",
            "example": "Todas las notificaciones fueron marcadas como leídas"
          }
        }
      }
order: 1000
