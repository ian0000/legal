$kind: http-example
request:
  url: "{{baseUrl}}/auth/profile-image"
  method: PUT
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: formdata
    content:
      - type: file
        key: image
        src: ""
        description: ""
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
