$kind: http-example
request:
  url: "{{baseUrl}}/auth/profile"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "firstName": "Ian",
        "lastName": "Mena",
        "email": "C0VL2UJQA@CVFRENPqdoLQdaLlxDNJmzwo.sg",
        "phone": "string",
        "cedula": "string"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
