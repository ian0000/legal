$kind: http-example
request:
  url: "{{baseUrl}}/auth/create-account"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "firstName": "Ian",
        "lastName": "Mena",
        "email": "ian@test.com",
        "role": "lawyer"
      }
response:
  statusCode: 201
  statusText: Created
  body:
    type: text
    content: ""
order: 1000
