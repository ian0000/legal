$kind: http-example
request:
  url: "{{baseUrl}}/auth/update-password/:token"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: token
      value: string
      description: Token de recuperación
  body:
    type: json
    content: |-
      {
        "password": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
