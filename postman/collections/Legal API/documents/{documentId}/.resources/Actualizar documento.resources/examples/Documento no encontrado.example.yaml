$kind: http-example
request:
  url: "{{baseUrl}}/documents/:documentId"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: documentId
      value: string
      description: ID del documento
  body:
    type: json
    content: |-
      {
        "name": "string",
        "visibility": "string",
        "documentType": "string",
        "tags": [
          "string",
          "string"
        ],
        "version": 6500.126104174469
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 3000
