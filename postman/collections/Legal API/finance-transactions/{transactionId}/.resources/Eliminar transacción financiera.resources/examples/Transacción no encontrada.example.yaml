$kind: http-example
request:
  url: "{{baseUrl}}/finance-transactions/:transactionId"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: transactionId
      value: string
      description: ID de la transacción
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 3000
