$kind: http-example
request:
  url: "{{baseUrl}}/case-stages/:id/status"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: ID de la etapa
  body:
    type: json
    content: |-
      {
        "status": "pending",
        "delayReason": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
