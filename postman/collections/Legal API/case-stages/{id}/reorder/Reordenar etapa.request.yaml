$kind: http-request
url: "{{baseUrl}}/case-stages/:id/reorder"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: string
    description: ID de la etapa
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "order": 2
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "order": {
          "type": "number",
          "example": 2
        }
      },
      "required": [
        "order"
      ]
    }
examples: ./.resources/Reordenar etapa.resources/examples
order: 1000
