$kind: http-example
request:
  url: "{{baseUrl}}/case-stages/:id/reorder"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: ID de la etapa
  body:
    type: json
    content: |-
      {
        "order": 2
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 3000
