$kind: http-example
request:
  url: "{{baseUrl}}/case-stages/:id/assign"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: string
      description: ID de la etapa
  body:
    type: json
    content: |-
      {
        "assignedTo": "681d0f8f8d7c4b0012f34abc"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
